<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag ensures that the website renders correctly across different device sizes, enhancing mobile responsiveness. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the external CSS stylesheet. Uncomment if you wish to customize or add styling. -->
    <link rel="stylesheet" href="styles.css"> 

    <title>Database Application</title>
</head>
<body>
    <!-- ===================================================================================== -->
    <!-- Display the current status of the database connection. 
         !!HERE TO HELP U DEBUGGING, NOT REQUIRED IN YOUR OWN PROJECT!!
         -->
    <h1 id = 'title'>Recipe Management System</h1>
    <div>
        <h1 id = 'title'>Database Connection Status: 
            <!-- An in-line placeholder to display connection status. -->
            <span id="dbStatus"> </span>
            <!-- A loading GIF, will be hided once get the status. -->
            <img id="loadingGif" class="loading-gif" src="loading_100px.gif" alt="Loading...">
        </h1>
    <div id = 'pagebuttons'>
        <button onclick = "window.location.href = 'recipepage.html'">Recipes</button>
        <button onclick = "window.location.href = 'coursepage.html'">Courses</button>
    </div>
    </div>
    <br><hr><br> <!-- ========================================================================= -->
    <div>
        <h2>User Registration</h2>
        <div id = 'userFormDiv'>
            <form id = 'userForm'>
                <label for="email">Email:</label><br>
                <input type="text" id = "emailID"><br>
                <label for="username">Username:</label><br>
                <input type="text" id = "usernameID">
            </form>
            <button id = 'enterNewUser'>Enter</button>
            <div id="enterNewUserResultMsg"></div>
        </div> 
    </div>

    <br><hr><br> <!-- ========================================================================= -->
    <div>
        <h2>Pro Registration</h2>
        <div id = 'proFormDiv'>
            <form id = 'proForm'>
                <label for="userId">User ID:</label><br>
                <input type="number" id = "userId"><br>
                <label for="YOE">How many years of exprience do you have:</label><br>
                <input type="number" id = "YOEId"><br>
                <label for="speciality">Your speciality:</label><br>
                <input type="text" id = "specialityId">
            </form>
            <button id = 'enterNewPro'>Enter</button>
            <div id="enterNewProResultMsg"></div>
        </div> 
    </div>

    <br><hr><br> <!-- ========================================================================= -->
    <h2>Reset All Tables</h2>
    <p>If you wish to reset the table press on the reset button. If this is the first time you're running this page, you MUST use reset</p>
    <button id="resetAllTables"> reset </button> <br>
    <div id="resetResultMsg"></div>


    <script src="scripts.js" defer></script>
</body>
</html>
