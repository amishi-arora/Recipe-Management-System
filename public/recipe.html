<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag ensures that the website renders correctly across different device sizes, enhancing mobile responsiveness. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Link to the external CSS stylesheet. Uncomment if you wish to customize or add styling. -->
    <link rel="stylesheet" href="/styles.css"> 

    <title>Database Application</title>
</head>
<body>
    <!-- ===================================================================================== -->
    <!-- Display the current status of the database connection. 
         !!HERE TO HELP U DEBUGGING, NOT REQUIRED IN YOUR OWN PROJECT!!
         -->
    <h1 id = 'title'>Recipe Management System</h1>
    <div>
        <h1 id = 'title'>Database Connection Status: 
            <!-- An in-line placeholder to display connection status. -->
            <span id="dbStatus"> </span>
            <!-- A loading GIF, will be hided once get the status. -->
            <img id="loadingGif" class="loading-gif" src="/loading_100px.gif" alt="Loading...">
        </h1>
    </div>


 

    <br><hr><br> <!-- ========================================================================= -->
    <div id = "main-content">
    <div>
    <div id = "left-section">
        <h2>View Recipe Details</h2>
        <form id = "recipe-details-form">
            <input name = "recipeattributes" class = "checkboxes" type="checkbox" value = "rID" checked>
            <label>Recipe ID</label><br>
            <input name = "recipeattributes" class = "checkboxes" type="checkbox" value = "title" checked>
            <label>Title</label><br>
            <input name = "recipeattributes" class = "checkboxes" type="checkbox" value = "description" checked>
            <label>Description</label><br>
            <input name = "recipeattributes" class = "checkboxes"  type="checkbox" value = "servings" checked>
            <label>Servings</label><br>
            <input name = "recipeattributes" class = "checkboxes" type="checkbox" value = "userID" checked>
            <label>Creator ID</label><br>
          </form>
          <button class = 'insertButton' id = "viewDetailsButton">Submit</button>
        <div id = 'recipe'>
        </div> 
    </div>

    <div>
        <h2>Add New Step</h2>
        <div id = 'stepForDiv'>
            <form id = 'stepForm'>
                <input type="text" id = "detail" placeholder = "Detail">
            </form>
            <button id = 'addStepButton'>Add</button>
            <div id="addStepResultMsg"></div>
            <div id = 'steps'></div>
        </div> 
    </div>
</div>

    <div id = "side-items">
        <div class = "side-container">
            <h2>Tags</h2>
            <form id = "tagsForm" action="insertTag">
                <input class = "recipeFormInputs" id = "tagName" placeholder = "Name"  type="text">
                <input class = "recipeFormInputs" id = "typeName" placeholder = "Type"  type="text">
                <button class = "insertButton" id = "addTagButton">Add</button>
            </form>
            <div id = 'tag-container'></div>
        </div>

        <div class = "side-container">
            <h2>Ingredients</h2>
            <form id = "ingredientsForm" action="insertIngredient">
                <input class = "recipeFormInputs" id = "inName" placeholder = "Name"  type="text">
                <input class = "recipeFormInputs" id = "inType" placeholder = "Type"  type="text">
                <input class = "recipeFormInputs" id = "inAmount" placeholder = "Amount"  type="text">
                <input class = "recipeFormInputs" id = "inCost" placeholder = "Cost ($)"  type="number">
                <button class = "insertButton" id = "addIngredientButton">Add</button>
            </form>
            <table id="ingTable">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Amount</th>
                        <th>Cost</th>
                    </tr>
                </thead>
                <tbody id = 'ingredient-container'>
                </tbody>
            </table>
        </div>

        <div class = "side-container">
            <h2>Equipment</h2>
            <form id = "equipmentForm" action="insertEquipment">
                <input class = "recipeFormInputs" id = "eqName" placeholder = "Name"  type="text">
                <input class = "recipeFormInputs" id = "buyFrom" placeholder = "Where to buy"  type="text">
                <button class = "insertButton" id = "addEqButton">Add</button>
            </form>
            <input class = "recipeFormInputs" id = "store" placeholder = "Search Store"  type="text">
            <button class = 'insertButton' id = 'searchStoreButton'>Search</button>
                <table id="eqTable">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Buy from</th>
                        </tr>
                    </thead>
                    <tbody id = 'equipment-container'>
                    </tbody>
                </table>
        </div>
    </div>
</div>


    
    <!-- ===================================================================================== -->
    <!-- External JavaScript file that contains the functionality/logic for the operations above. -->
    <script src="/recipe.js" defer></script>
</body>
</html>
